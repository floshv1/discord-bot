server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube is served by LavaSrc's `ytdlp` source, not by the `youtube-plugin`.
    #
    # That plugin was removed rather than kept as a fallback, and the reason is routing, not
    # taste: both register the `ytsearch:` prefix and both claim youtube.com/youtu.be URLs, so
    # loading the two leaves which one answers undefined. The failure mode of getting that
    # wrong is the worst kind — yt-dlp would look broken while never actually being called.
    #
    # It is also not a fallback worth keeping. It failed 100% of tracks here: its local cipher
    # extraction is a dead end upstream closed as *not planned*, and every one of its clients
    # was refused by YouTube's anti-bot check wearing a different error. See CLAUDE.md.
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"
    sources:
      # Lavalink's own YouTube source is deprecated upstream and must stay off — LavaSrc owns
      # YouTube here.
      youtube: false
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10

plugins:
  lavasrc:
    # How a Spotify link is actually played: LavaSrc resolves it to a searchable query and
    # replays it through `ytsearch:`, which is now yt-dlp. ISRC first — it identifies the exact
    # recording rather than a cover or a live version — with the plain query as the fallback.
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      ytdlp: true
    ytdlp:
      # Resolved from PATH inside the image; see lavalink/Dockerfile. yt-dlp is the most
      # actively maintained YouTube extractor there is — it ships fixes for YouTube's changes
      # within days, which is the whole reason this replaced youtube-source.
      path: "yt-dlp"
      searchLimit: 10
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6

logging:
  level:
    root: INFO
    lavalink: INFO
