server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube is served by LavaSrc's `ytdlp` source, not by the `youtube-plugin`.
    #
    # That plugin was removed rather than kept as a fallback, and the reason is routing, not
    # taste: both register the `ytsearch:` prefix and both claim youtube.com/youtu.be URLs, so
    # loading the two leaves which one answers undefined. The failure mode of getting that
    # wrong is the worst kind — yt-dlp would look broken while never actually being called.
    #
    # It is also not a fallback worth keeping. It failed 100% of tracks here: its local cipher
    # extraction is a dead end upstream closed as *not planned*, and every one of its clients
    # was refused by YouTube's anti-bot check wearing a different error. See CLAUDE.md.
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"
    sources:
      # Lavalink's own YouTube source is deprecated upstream and must stay off — LavaSrc owns
      # YouTube here.
      youtube: false
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      # Off on purpose: with it on, `/play http://db:5432` (or any internal host) makes Lavalink
      # issue the request from inside our Docker network — members could probe services that
      # are deliberately never published. Nothing we play needs it: YouTube goes through
      # yt-dlp and Spotify is replayed through `ytsearch:`.
      http: false
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10

plugins:
  lavasrc:
    # How a Spotify link is actually played: LavaSrc resolves it to a searchable query and
    # replays it through `ytsearch:`, which is now yt-dlp. ISRC first — it identifies the exact
    # recording rather than a cover or a live version — with the plain query as the fallback.
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      ytdlp: true
    ytdlp:
      # Resolved from PATH inside the image; see lavalink/Dockerfile. yt-dlp is the most
      # actively maintained YouTube extractor there is — it ships fixes for YouTube's changes
      # within days, which is the whole reason this replaced youtube-source.
      path: "yt-dlp"
      searchLimit: 10
      # visionos first, or most tracks die on a 403. yt-dlp's default order starts with tv_samsung,
      # whose links only become valid after a pre-roll wait (`available_at`, 5-6 s measured). yt-dlp
      # sleeps through it when *it* downloads; LavaSrc only takes the URL and fetches it at once.
      # The first client wins for a given format. The others stay as a fallback for what visionos
      # cannot serve (made-for-kids videos). These args replace LavaSrc's defaults, so keep
      # -q/--no-warnings/-J: anything printed outside the JSON breaks its parser.
      customPlaybackArgs:
        - "-q"
        - "--no-warnings"
        - "-f"
        - "bestaudio"
        - "-J"
        - "--extractor-args"
        - "youtube:player_client=visionos,tv_samsung,web"
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      # Spotify playlists do not load, and no setting here fixes that (as of LavaSrc 4.8.3):
      #   - v1 answers 401 "Valid user authentication required" on `/v1/playlists/{id}/items`
      #     to this client-credentials token (the playlist's own metadata still loads).
      #   - `preferPartnerApi: true` was tried and fails earlier: its anonymous token is minted
      #     from a secret scraped out of the web player's JS ("No secret array found in
      #     script"), and Spotify changed that script. It then falls back to the same 401.
      #   - `spDc` does NOT help: the partner API always uses the anonymous token; the cookie
      #     only feeds the lyrics endpoint.
      # Re-enable `preferPartnerApi` only after a LavaSrc release fixes the secret scraping.
      # Single tracks and albums are unaffected.
      playlistLoadLimit: 6
      albumLoadLimit: 6

logging:
  level:
    root: INFO
    lavalink: INFO
