name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv --no-cache-dir

      - name: Install dev dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv --no-cache-dir

      - name: Install dev dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install --upgrade pip && pip install uv --no-cache-dir

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit dependencies
        run: uv run pip-audit

  # Build-only: Komodo builds this image itself on deploy, so nothing is pushed. Without this
  # job a broken lavalink/Dockerfile (a checksum mismatch, a renamed release asset, an
  # unsupported arch) only surfaced at deploy time, after main had already moved on.
  docker-lavalink:
    name: Build Lavalink Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./lavalink
          push: false
          provenance: false

  activity-web:
    name: Activity Front (test & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: activity/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: activity/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  # Built on every push and PR (the Dockerfile re-runs the front tests and the build), pushed on main only.
  # The `docker` job waits for it: Komodo redeploys the whole stack off the bot image, and the stack now
  # references this one, so it has to exist by then.
  docker-activity:
    name: Build & Push Activity Image
    runs-on: ubuntu-latest
    needs: [lint, test, security, activity-web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: activity/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false
          tags: ghcr.io/floshv1/discord-bot-activity:latest

  docker:
    name: Build & Push Bot Image
    runs-on: ubuntu-latest
    # docker-lavalink and docker-activity too: Komodo redeploys the whole stack off this push, so every
    # image it references must exist by then.
    needs: [lint, test, security, docker-lavalink, docker-activity]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ghcr.io/floshv1/discord-bot:latest

  docker-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard/api
          push: true
          provenance: false
          tags: ghcr.io/floshv1/discord-bot-api:latest

  docker-web:
    name: Build & Push Web Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard/web
          push: true
          provenance: false
          tags: ghcr.io/floshv1/discord-bot-web:latest