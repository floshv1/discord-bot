services:
  bot:
    image: ghcr.io/floshv1/discord-bot:latest
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: postgresql://botuser:${POSTGRES_PASSWORD}@db:5432/discord_bot
      GUILD_ID: ${GUILD_ID}
      LOG_CHANNEL_ID: ${LOG_CHANNEL_ID}
      LOG_IGNORED_CHANNEL_IDS: ${LOG_IGNORED_CHANNEL_IDS:-}
      VOICE_LEADERBOARD_CHANNEL_ID: ${VOICE_LEADERBOARD_CHANNEL_ID:-}
      BIRTHDAY_CHANNEL_ID: ${BIRTHDAY_CHANNEL_ID:-}
      BIRTHDAY_ANNOUNCE_CHANNEL_ID: ${BIRTHDAY_ANNOUNCE_CHANNEL_ID:-}
      CURRENCY_LEADERBOARD_CHANNEL_ID: ${CURRENCY_LEADERBOARD_CHANNEL_ID:-}
      BETTING_CHANNEL_ID: ${BETTING_CHANNEL_ID:-}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      PANDASCORE_API_KEY: ${PANDASCORE_API_KEY:-}
      LAVALINK_URI: http://lavalink:2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
    depends_on:
      db:
        condition: service_healthy
      lavalink:
        condition: service_healthy

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    environment:
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2333/v4/info -H 'Authorization: ${LAVALINK_PASSWORD:-youshallnotpass}' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: discord_bot
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d discord_bot"]
      interval: 5s
      retries: 5

  api:
    image: ghcr.io/floshv1/discord-bot-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://botuser:${POSTGRES_PASSWORD}@db:5432/discord_bot
      GUILD_ID: ${GUILD_ID}
      DASHBOARD_SECRET: ${DASHBOARD_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://localhost:8090/auth/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3100/overview}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/floshv1/discord-bot-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api

volumes:
  pg_data:
