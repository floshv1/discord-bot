services:
  bot:
    image: ghcr.io/floshv1/discord-bot:latest
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: postgresql://botuser:${POSTGRES_PASSWORD}@db:5432/discord_bot
      GUILD_ID: ${GUILD_ID}
      LOG_CHANNEL_ID: ${LOG_CHANNEL_ID}
      LOG_IGNORED_CHANNEL_IDS: ${LOG_IGNORED_CHANNEL_IDS:-}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      PANDASCORE_API_KEY: ${PANDASCORE_API_KEY:-}
      LAVALINK_URI: http://lavalink:2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in the stack env (openssl rand -hex 32)}
      # Presence only — the secret stays on the lavalink service, which does the resolving.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      # LoL customs: the lol-amis stack, reached over lolamis_net. Empty = feature off.
      LOLAMIS_URL: ${LOLAMIS_URL-http://lol-amis:8000}
      # LoLdle Activity. The password creates the restricted `loldle_activity` Postgres role at boot;
      # the internal URL is what /loldle probes (no colon: an *empty* value turns the Activity off).
      ACTIVITY_DB_PASSWORD: ${ACTIVITY_DB_PASSWORD:-}
      LOLDLE_ACTIVITY_INTERNAL_URL: ${LOLDLE_ACTIVITY_INTERNAL_URL-http://loldle-activity:8080}
    networks:
      # `default` must be listed explicitly: naming any network here opts the service out
      # of the implicit one, and the bot would lose the database and Lavalink.
      #
      # The priority decides which gateway carries the *default route*: `default`, never
      # lolamis_net. Docker would happen to pick it today (alphabetical tie-break), which is
      # not a thing to depend on.
      default:
        priority: 100
      # Only to call lol-amis' API; never the default route.
      lolamis:
        priority: 10
    depends_on:
      db:
        condition: service_healthy
      lavalink:
        condition: service_healthy

  lavalink:
    # Built, not pulled: the image is stock Lavalink plus a yt-dlp binary, which LavaSrc's
    # `ytdlp` source executes. A rebuild is also how yt-dlp gets updated — see
    # lavalink/Dockerfile for why we don't use the ready-made image upstream publishes.
    build:
      context: ./lavalink
    restart: unless-stopped
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    environment:
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in the stack env (openssl rand -hex 32)}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2333/v4/info -H 'Authorization: ${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in the stack env (openssl rand -hex 32)}' && yt-dlp --version >/dev/null && deno --version >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # LoLdle Activity: the only service reachable from the Internet (Tailscale Funnel -> 127.0.0.1:3250).
  # It holds no bot token and connects as the restricted `loldle_activity` role, on the default network
  # only. An empty client id/secret/session secret makes it answer 503; an empty ACTIVITY_DB_PASSWORD
  # makes the bot switch the role off, so the container cannot log in and keeps retrying (the stack still starts).
  loldle-activity:
    image: ghcr.io/floshv1/discord-bot-activity:latest
    restart: unless-stopped
    environment:
      ACTIVITY_DATABASE_URL: postgresql://loldle_activity:${ACTIVITY_DB_PASSWORD:-}@db:5432/discord_bot
      ACTIVITY_CLIENT_ID: ${ACTIVITY_CLIENT_ID:-}
      ACTIVITY_CLIENT_SECRET: ${ACTIVITY_CLIENT_SECRET:-}
      ACTIVITY_SESSION_SECRET: ${ACTIVITY_SESSION_SECRET:-}
      GUILD_ID: ${GUILD_ID}
    ports:
      - "127.0.0.1:3250:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: discord_bot
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d discord_bot"]
      interval: 5s
      retries: 5

  api:
    image: ghcr.io/floshv1/discord-bot-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://botuser:${POSTGRES_PASSWORD}@db:5432/discord_bot
      GUILD_ID: ${GUILD_ID}
      DASHBOARD_SECRET: ${DASHBOARD_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://localhost:8090/auth/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3100/overview}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/floshv1/discord-bot-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api

volumes:
  pg_data:

networks:
  default:
  # Created by the lol-amis stack (team-generator/lol-amis/compose.yml), which must be deployed
  # first: an external network that does not exist stops this whole stack from starting.
  lolamis:
    name: lolamis_net
    external: true
