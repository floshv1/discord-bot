services:
  bot:
    image: ghcr.io/floshv1/discord-bot:latest
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: postgresql://botuser:${POSTGRES_PASSWORD}@db:5432/discord_bot
      GUILD_ID: ${GUILD_ID}
      LOG_CHANNEL_ID: ${LOG_CHANNEL_ID}
      LOG_IGNORED_CHANNEL_IDS: ${LOG_IGNORED_CHANNEL_IDS:-}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      PANDASCORE_API_KEY: ${PANDASCORE_API_KEY:-}
      LAVALINK_URI: http://lavalink:2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in the stack env (openssl rand -hex 32)}
      # Presence only — the secret stays on the lavalink service, which does the resolving.
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      # Palworld panel. Komodo starts/stops the stack; the game's REST API says who is
      # connected. Unset any of them and the feature degrades instead of breaking.
      KOMODO_URL: ${KOMODO_URL:-}
      KOMODO_API_KEY: ${KOMODO_API_KEY:-}
      KOMODO_API_SECRET: ${KOMODO_API_SECRET:-}
      PALWORLD_STACK: ${PALWORLD_STACK:-palworld}
      PALWORLD_REST_URL: ${PALWORLD_REST_URL:-}
      PALWORLD_ADMIN_PASSWORD: ${PALWORLD_ADMIN_PASSWORD:-}
      PALWORLD_ADDRESS: ${PALWORLD_ADDRESS:-}
    # Komodo listens on the host, not on any of our networks.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      # `default` must be listed explicitly: naming any network here opts the service out
      # of the implicit one, and the bot would lose the database and Lavalink.
      #
      # The priority is not decoration. It decides which gateway carries the *default
      # route*, and palworld_net's gateway is covered by the PALWORLD-ISOLATION chain: if
      # the bot left through 10.99.99.1, its own packets to Komodo would be dropped by the
      # rules meant for the game. Docker would happen to pick `default` today (it breaks
      # the tie alphabetically), which is not a thing to depend on.
      default:
        priority: 100
      palworld:
        priority: 10
    depends_on:
      db:
        condition: service_healthy
      lavalink:
        condition: service_healthy

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    environment:
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in the stack env (openssl rand -hex 32)}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      # Read by `plugins.youtube.remoteCipher.password` — must match ytcipher's API_TOKEN.
      - YTCIPHER_TOKEN=${YTCIPHER_TOKEN:?set YTCIPHER_TOKEN in the stack env (openssl rand -hex 32)}
    depends_on:
      # Plain `depends_on`, not `service_healthy`: the image publishes no health endpoint, and
      # the youtube plugin falls back to its own (broken) local extraction rather than erroring
      # if the cipher server isn't up yet. Degraded for a few seconds, not broken.
      - ytcipher
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2333/v4/info -H 'Authorization: ${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in the stack env (openssl rand -hex 32)}' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Resolves YouTube's signature ciphers for the Lavalink youtube plugin. Without it every
  # track dies on "Must find sig function from script" — see lavalink/application.yml.
  # No `ports:`: only lavalink talks to it, over the default network. Publishing it would put
  # an open deciphering service on the host.
  ytcipher:
    image: ghcr.io/kikkia/yt-cipher:master
    restart: unless-stopped
    environment:
      - API_TOKEN=${YTCIPHER_TOKEN:?set YTCIPHER_TOKEN in the stack env (openssl rand -hex 32)}
      # Pin the player script variant the service resolves against, as upstream recommends.
      - OVERRIDE_PLAYER_VARIANT=IAS

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: discord_bot
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d discord_bot"]
      interval: 5s
      retries: 5

  api:
    image: ghcr.io/floshv1/discord-bot-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://botuser:${POSTGRES_PASSWORD}@db:5432/discord_bot
      GUILD_ID: ${GUILD_ID}
      DASHBOARD_SECRET: ${DASHBOARD_SECRET}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://localhost:8090/auth/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3100/overview}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/floshv1/discord-bot-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api

volumes:
  pg_data:

networks:
  default:
  # Cree par la stack palworld. Le bot y entre uniquement pour lire l'API REST du jeu sur
  # http://palworld-server:8212 — port qui reste publie sur 127.0.0.1 seulement, donc
  # aucun autre conteneur de la machine (dont DVWA et Juice Shop) ne peut l'atteindre.
  # Contrepartie a connaitre : la chaine iptables PALWORLD-ISOLATION filtre sur
  # -s 10.99.99.0/24 et voit donc aussi les paquets du bot ; palworld-isolation.sh a
  # deux regles pour ca.
  palworld:
    name: palworld_net
    external: true
