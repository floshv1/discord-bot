# Development environment — builds the bot from local source and runs it against
# its OWN Postgres + Lavalink, fully isolated from production.
#
# Used in two places, both with a dedicated TEST bot token (never the prod token):
#
#   • Locally — variables come from .env.dev:
#       docker compose -f compose.dev.yml --env-file .env.dev up --build
#       docker compose -f compose.dev.yml --env-file .env.dev down        # stop
#       docker compose -f compose.dev.yml --env-file .env.dev down -v      # stop + wipe dev DB
#
#   • Komodo "development" stack — point a separate Komodo stack at this repo's
#     `dev` branch with this file; set the ${...} variables in the stack's
#     environment (no .env.dev needed). Komodo builds from source (build: .).
#     See docs/deployment.md → "Development stack (branch dev)".
#
# The `name:` below gives this stack its own project namespace and network, so it
# can run on the same machine as the production stack without conflicts.
name: discord-bot-dev

services:
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      lavalink:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DATABASE_URL=postgresql://botuser:${POSTGRES_PASSWORD}@db:5432/discord_bot
      - GUILD_ID=${GUILD_ID}
      - LOG_CHANNEL_ID=${LOG_CHANNEL_ID}
      - LOG_IGNORED_CHANNEL_IDS=${LOG_IGNORED_CHANNEL_IDS:-}
      - VOICE_LEADERBOARD_CHANNEL_ID=${VOICE_LEADERBOARD_CHANNEL_ID:-}
      - BIRTHDAY_CHANNEL_ID=${BIRTHDAY_CHANNEL_ID:-}
      - BIRTHDAY_ANNOUNCE_CHANNEL_ID=${BIRTHDAY_ANNOUNCE_CHANNEL_ID:-}
      - FOOTBALL_DATA_API_KEY=${FOOTBALL_DATA_API_KEY:-}
      - PANDASCORE_API_KEY=${PANDASCORE_API_KEY:-}
      - LAVALINK_URI=http://lavalink:2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
    environment:
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2333/v4/info -H 'Authorization: ${LAVALINK_PASSWORD:-youshallnotpass}' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: discord_bot
    # Exposed on 5433 (not 5432) so it never clashes with a local production DB.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d discord_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
